name: Manual build and deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: site
          lfs: true
          persist-credentials: false

      - name: Check out md2html
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: physbuzz/md2html
          ref: baad11bfd7c812e8c2ea1e4b952b61fd1a770ba0
          path: md2html
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: md2html/.node-version
          package-manager-cache: false

      - name: Install md2html dependencies
        working-directory: md2html
        run: |
          pipx install uv==0.13.1
          uv sync --locked --no-dev
          npm ci --ignore-scripts --omit=dev

      - name: Build website
        working-directory: site
        run: ../md2html/.venv/bin/md2html --no-execute

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./site/_site/
          state-name: .md2html-ftp-sync-state.json

