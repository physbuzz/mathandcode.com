name: Manual build and deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: site
          lfs: true
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false

      - name: Install md2html v1.0.2
        working-directory: ${{ runner.temp }}
        run: |
          release=https://github.com/physbuzz/md2html/releases/download/v1.0.2
          curl --fail --location "$release/md2html-1.0.2-linux-x86_64" -o md2html-1.0.2-linux-x86_64
          curl --fail --location "$release/SHA256SUMS" -o SHA256SUMS
          sha256sum --check SHA256SUMS
          install -Dm755 md2html-1.0.2-linux-x86_64 "$HOME/.local/bin/md2html"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build website
        working-directory: site
        run: |
          md2html --no-execute
          if grep -rIl '^version https://git-lfs.github.com/spec/v1$' _site; then
            echo "Git LFS pointers found in the build; refusing to deploy." >&2
            exit 1
          fi

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./site/_site/
          state-name: .md2html-ftp-sync-state.json

