---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-kicker">{{ page.date | date: "%B %-d, %Y" }}</p>
    {% if page.tags.size > 0 %}
    <div class="tag-row" aria-label="Tags">
      {% for tag in page.tags %}
      <a class="tag" href="{{ '/tags/' | relative_url }}#{{ tag | downcase | replace: ' ', '-' }}">{{ tag }}</a>
      {% endfor %}
    </div>
    {% endif %}
  </header>

  <div class="post-content">
{{ content }}
  </div>
</article>
