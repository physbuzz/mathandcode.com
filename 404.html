permalink: /404.html
layout: page
title: Page Not Found
description: The requested page could not be found.
---

<div class="not-found">
  <p>The requested page could not be found.</p>
  <p id="suggestion"></p>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var path = document.location.pathname;
  var elem = document.getElementById('suggestion');
  if (!elem) return;
  if (path.indexOf('/archive') === 0) {
    elem.innerHTML = 'Archived page could not be found at <a href="' + document.location.href + '">' + document.location.href + '</a>.';
  } else {
    var url = '{{ site.url }}{{ site.baseurl }}/archive' + path;
    elem.innerHTML = 'Try the archived directory: <a href="' + url + '">' + url + '</a>.';
  }
});
</script>
